# ARCH-2-3：Prometheus 抓取/告警编排（设计 §2.3 决策 D7 / §3 Phase 2 表 2-3 行）
#
# 两个抓取目标对应指标暴露拓扑（见 app/celery_app.py 文件头 ARCH-2-3 注释块）：
#   - ai-evo-api：api 容器 :8100/metrics——队列深度 gauge（api 进程 Redis llen
#     周期刷新）+ api 进程运行时指标；
#   - ai-evo-worker：worker/worker-ingest 容器的 PROMETHEUS_WORKER_METRICS_PORT
#     （compose 统一注入 9108）——任务时长直方图/失败计数（prefork 子进程经
#     PROMETHEUS_MULTIPROC_DIR per-pid mmap 文件聚合）+ 沙箱启动延迟。
# 沙箱面（COMPOSE_PROFILES=sandbox）的 executor 不抓取：其 /health 探活由
# compose healthcheck 承担，运行指标按需后补。
# 抓取间隔 15s 与 api 侧 gauge 刷新间隔（app/main.py QUEUE_DEPTH_REFRESH_SECONDS）
# 对齐；目标暂不可达只影响该 target 自身（up=0），不阻塞其余抓取。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ai-evo-api
    static_configs:
      - targets: ["api:8100"]
        labels:
          component: api

  - job_name: ai-evo-worker
    static_configs:
      - targets: ["worker:9108"]
        labels:
          component: worker-eval
      - targets: ["worker-ingest:9108"]
        labels:
          component: worker-ingest

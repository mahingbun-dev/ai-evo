name: 'AI-Evo Gate'
description: '触发 AI-Evo 评测任务并按门禁判定给出步骤结论（exit 0=通过 / 1=门禁失败 / 2=错误）'
inputs:
  aievo-url:
    description: '平台地址（如 https://aievo.example.com）'
    required: true
  aievo-api-key:
    description: 'API Key（aievo_sk_ 开头，需持 tasks:run + tasks:read scope）'
    required: true
  task-id:
    description: '评测任务 ID'
    required: true
  timeout:
    description: '最长等待秒数'
    required: false
    default: '7200'
  interval:
    description: '轮询间隔秒数'
    required: false
    default: '5'
  python-version:
    description: '安装 aievo-cli 使用的 Python 版本'
    required: false
    default: '3.11'
  cli-repo:
    description: 'aievo-cli 源码仓库（含 cli/ 子目录）；PyPI 未发布或私有网络时作为回退安装源'
    required: false
    default: 'https://github.com/mahingbun-dev/ai-evo.git'

runs:
  using: 'composite'
  steps:
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: 安装 aievo-cli
      shell: bash
      # 双通道（P0-E）：优先 PyPI；未发布/私有网络回退 git 子目录安装
      run: pip install aievo-cli || pip install "aievo-cli @ git+${AIEVO_CLI_REPO}#subdirectory=cli"
      env:
        AIEVO_CLI_REPO: ${{ inputs.cli-repo }}

    - name: 评测门禁（exit 0=通过 / 1=门禁失败 / 2=错误）
      shell: bash
      env:
        AIEVO_URL: ${{ inputs.aievo-url }}
        AIEVO_API_KEY: ${{ inputs.aievo-api-key }}
        AIEVO_TASK_ID: ${{ inputs.task-id }}
        AIEVO_TIMEOUT: ${{ inputs.timeout }}
        AIEVO_INTERVAL: ${{ inputs.interval }}
      run: |
        aievo config add "$AIEVO_URL" "$AIEVO_API_KEY"
        aievo run "$AIEVO_TASK_ID" --wait --timeout "$AIEVO_TIMEOUT" --interval "$AIEVO_INTERVAL" --json

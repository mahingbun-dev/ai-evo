# GitLab CI 模板：AI-Evo 评测门禁
#
# 用法：在 .gitlab-ci.yml 中 include 本文件，再 extend 隐藏模板并填任务 ID：
#
#   include:
#     - local: 'ci-templates/gitlab/aievo-gate.yml'   # 或 remote: 平台仓库 raw 地址
#
#   aievo:gate:demo:
#     extends: .aievo_gate_template
#     variables:
#       AIEVO_TASK_ID: "task_xxx"
#
# 凭据走 CI/CD Variables（Settings → CI/CD → Variables）：
#   AIEVO_URL      平台地址
#   AIEVO_API_KEY  API Key（aievo_sk_ 开头，需持 tasks:run + tasks:read scope；勾选 Masked）
#
# 退出码：0=门禁通过；1=门禁失败（质量不达标，job 置 failed 卡合并）；
#         2=错误（认证/网络/超时等基础设施故障，同样置 failed，需人工区分）

.aievo_gate_template:
  stage: test
  image: python:3.12-slim
  variables:
    # 覆盖默认等待时长（秒）
    AIEVO_TIMEOUT: "7200"
  before_script:
    # 双通道（P0-E）：优先 PyPI；未发布/私有网络回退 git 子目录安装
    # AIEVO_CLI_REPO 可覆盖为私有 fork（默认评测任务所在仓库）
    - pip install --quiet aievo-cli || pip install --quiet "aievo-cli @ git+${AIEVO_CLI_REPO:-$CI_PROJECT_URL}#subdirectory=cli"
    - aievo config add "$AIEVO_URL" "$AIEVO_API_KEY"
  script:
    - aievo run "$AIEVO_TASK_ID" --wait --timeout "$AIEVO_TIMEOUT" --json

# ai-evo 构建服务配置模板
#
# 部署到服务器：/apps/qa-code/ai-evo/build-service/config.toml
#   1. cp config.example.toml config.toml
#   2. 填入真实的 token 与 GitLab 凭据
#   3. chmod 600 config.toml   —— 含凭据，不要入库
#
# 路径约定与 docs/build-pipeline.md 一致。

[auth]
# GitLab CI 调用时携带的 X-Build-Token，取值与 GitLab 项目的
# CI/CD Variable BUILD_API_TOKEN 一致（建议 32 位以上随机串）
token = "CHANGE_ME_TO_A_LONG_RANDOM_STRING"

[paths]
# 生产工作区：仅用于读取 git remote，不作为构建目录
workspace = "/apps/qa-code/ai-evo"
# 隔离的构建工作区：build-service 独占，git checkout/clean 都在这里发生，
# 避免污染生产工作区（其中有运行中的 compose 与 .env）
build_workspace = "/apps/qa-code/ai-evo-build"
# docker compose 实际运行目录（部署时同步 compose 到这里、更新这里的 .env）
deploy_dir = "/apps/qa-code/ai-evo"
# 构建服务自身的数据目录（releases/ 版本记录、logs/ 任务日志）
data_dir = "/apps/qa-code/ai-evo/build-service/data"

[builder]
# 预烘焙工具链的构建容器镜像（在开发机构建后导出到服务器，见 docs/build-pipeline.md）
image = "ai-evo-builder:latest"
# 构建出的应用镜像名
image_name = "ai-evo"
# 跨构建复用的缓存目录（宿主机目录，不要用 docker 卷——卷落在 docker root 分区）
cache_dir = "/apps/qa-code/ai-evo-build-cache"

[deploy]
compose_file = "docker-compose.yml"
env_file = ".env"
# 部署后要求全部处于 running 的服务
services = ["api", "worker"]
# 部署后的 HTTP 探活地址（/api/v1/auth/status 在鉴权白名单内，无需 cookie）
health_url = "http://127.0.0.1:8100/api/v1/auth/status"
# nginx 的前端静态根（宿主机路径，见 /etc/nginx/conf.d/eval-frontend.conf 的 root）。
#
# 用户访问的站点由 nginx 直接托管这个目录，**不是**容器里 FastAPI 托管的那份 dist。
# 只部署容器、不同步这里，用户看到的仍是旧前端——首次部署实际踩到过。
# 留空则跳过前端同步（仅当前端不由 nginx 托管时才应留空）。
frontend_root = "/apps/qa-code/ai-evo/frontend/dist"
# 保留的前端备份份数（每次同步前会把旧 dist 改名备份，便于快速回退）
keep_frontend_backups = 3
# 保留的可回滚版本数。
# 同时作用于两处：releases/ 里的版本记录，以及宿主机上按 tag 累积的旧镜像
#（每个镜像约 500MB，不清理的话几十次部署就会占满磁盘）。
# 清理时始终额外保留 .env 里正在使用的 tag 与 releases 记录里出现过的 tag，
# 且 docker 会拒绝删除正在被容器使用的镜像——回滚目标不会丢。
# 设为 0 可关闭镜像清理。
keep_releases = 5
# worker 非阻塞优雅换代参数（见 build_service.py 的 swap_worker 与
# docs/build-pipeline.md「部署时的任务中断行为」一节）：
#   drain_wait_sec        流水线内等旧 worker 退出的短窗口（秒）。超时即转入
#                         后台 watcher，流水线不再阻塞。空闲部署的 worker 收到
#                         SIGTERM 后几秒内退出，2 分钟足够覆盖。
#   drain_force_kill_sec  后台 watcher 强制回收上限（秒）。默认 7500 =
#                         celery task_time_limit（2h）+ 缓冲；正常情况下长任务
#                         到点会被 celery 强杀、worker 随之退出，轮不到触发。
drain_wait_sec = 120
drain_force_kill_sec = 7500

[timeouts]
# 构建超时（秒）：前端 pnpm build + docker build
build_sec = 3600
# 部署超时（秒）：worker 已改为非阻塞换代（不再被 stop_grace_period 阻塞），
# 该上限只需覆盖 api/hub-plugin 重建 + 数据库迁移 + verify
deploy_sec = 1800

# 构建后镜像漏洞扫描门禁（ARCH-3-3，设计 §3 Phase 3 表 3-3 行）
# 在构建产物落 daemon 之后、写 release 记录之前跑 trivy：HIGH 及以上
# （severity 档位）且有修复版本的 CVE → 构建失败，有漏洞的镜像不可部署。
# 与 GitHub CI 的 image-scan job（.github/workflows/ci.yml）同一口径。
#
# 离线约束：扫描器是预烘焙镜像（aquasec/trivy + 离线漏洞库），部署机不能
# 下载任何东西——**上线含本功能的 build-service 镜像前必须先预载它**，
# 构建与传输步骤见 docs/build-pipeline.md 第十一节。门禁 fail-closed：
# 扫描器镜像缺失时构建同样失败（不会静默放行）。
[scan]
# 门禁开关。默认 true；仅过渡期可显式 false（高危 CVE 不再卡构建，需安全
# 负责人知情），修完扫描器预载后应立即恢复
enabled = true
# 预烘焙的 trivy 扫描器镜像（含离线漏洞库，见 docs/build-pipeline.md 第十一节）
image = "ai-evo-trivy:latest"
# 卡门禁的严重级别（trivy severity 子集，逗号分隔）。「HIGH 及以上」即此默认
severity = "HIGH,CRITICAL"
# 单次扫描超时（秒）
timeout_sec = 900

[gitlab]
host = "https://gitlab.example.com"
# 克隆地址必须内嵌 Deploy Token，否则 build-service 从远端 clone 构建工作区时
# 会因为仓库是私有的而失败。用户名的 "+" 要写成 %2B。
# 本项目的 Deploy Token 含 read_repository scope，正好用于克隆。
# 参考同机 anc 项目的做法（其构建工作区 remote 就是这种形式）。
repo_url = "https://gitlab+deploy-token:<token>@gitlab.example.com/group/project.git"
# 项目数字 ID（已确认）。必须是数字 ID：Deploy Token 没有 read_project 权限，
# 用项目路径查询 API 会返回 404 Project Not Found。
# 查法见 docs/build-pipeline.md 第 4.2.1 节。
project_id = "152361"
# 离线快照包名（与 tools/upload-offline-snapshot.sh 的 SNAPSHOT_PACKAGE 一致）
snapshot_package = "ai-evo-offline-snapshot"
# 离线 git 运行时包名（与 tools/prepare-git-bin.sh 的 PKG 一致）
git_package = "ai-evo-git-bin"
# Deploy Token「ci/cd」的凭据：用户名形如 gitlab+deploy-token-<n>，密码是 token 值。
# 该 token 的 scope 为 read_repository + read_package_registry + write_package_registry，
# 下载离线快照只需要 read_package_registry。
deploy_token_user = ""
deploy_token_pass = ""

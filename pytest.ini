[pytest]
pythonpath = .

addopts = -v --tb=short

testpaths = tests

markers =
    e2e: 端到端测试（真模型/真 SSO/真服务，依赖外部环境；CI 永不跑，仅本地手动执行）
    p0: P0 优先级测试
    quality: 质量评估测试
    consistency: 一致性测试
    success_rate: 成功率测试
    unit: L1 单元测试（无网络/无 DB；整改计划 §5.1，W8 起作为 CI 强制门禁）
    integration: L2 集成测试（本地 PG/Redis 真实交互；跑不了明确 skip，不许假绿）



[pytest]
pythonpath = .

# sandbox_e2e（沙箱逃逸实机档，ARCH-1-5）默认 deselect：需真 docker daemon +
# script-runner 镜像，只在部署机/本机显式 `-m sandbox_e2e` 跑；命令行 -m
# 覆盖本缺省（addopts 在前、CLI 在后），其余选择口径不受影响
addopts = -v --tb=short -m "not sandbox_e2e"

testpaths = tests

markers =
    e2e: 端到端测试（真模型/真 SSO/真服务，依赖外部环境；CI 永不跑，仅本地手动执行）
    p0: P0 优先级测试
    quality: 质量评估测试
    consistency: 一致性测试
    success_rate: 成功率测试
    unit: L1 单元测试（无网络/无 DB；整改计划 §5.1，W8 起作为 CI 强制门禁）
    integration: L2 集成测试（本地 PG/Redis 真实交互；跑不了明确 skip，不许假绿）
    sandbox_e2e: 沙箱逃逸实机测试（ARCH-1-5：真 docker daemon + script-runner 镜像跑逃逸探针集；默认 deselect，须 -m sandbox_e2e 显式执行；CI 不跑）


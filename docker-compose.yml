# 部署由 GitLab CI 驱动（见 docs/build-pipeline.md）：
#   - 镜像 tag 由 CI 写入 .env 的 IMAGE_TAG，回滚即改回旧 tag
#   - 数据库/Redis 等敏感配置放服务器上的 .env（不入库）
#   - OPENBLAS_CORETYPE / MKL_DEBUG_CPU_TYPE 是老旧 CPU（缺 X86_V2 指令集）
#     的规避参数，非敏感配置，留在 environment 中
#
# 自建在线部署（如群晖，联网可用）：
#   - api/worker 带 build 定义，本地无 ai-evo 镜像时自动用 Dockerfile.online
#     构建（前端 dist 在镜像内现构建，依赖从 PyPI 安装，可用 PIP_INDEX_URL 换源）
#   - .env 里设 COMPOSE_PROFILES=bundled-db 可一并启动内置 PostgreSQL
#     （生产 CI 部署不设该 profile，行为与原来完全一致）
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ai-evo-postgres
    profiles: ["bundled-db"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai_evo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai_evo_dev}
      - POSTGRES_DB=${POSTGRES_DB:-ai_evo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_evo} -d ${POSTGRES_DB:-ai_evo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ai-evo-net

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    container_name: ai-evo-redis
    restart: unless-stopped
    networks:
      - ai-evo-net

  api:
    image: ai-evo:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.online
      args:
        - NODE_IMAGE=${NODE_IMAGE:-node:24-slim}
        - PY_IMAGE=${PY_IMAGE:-python:3.12-slim}
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ai-evo-api
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=api
      - LANGFUSE_ENABLED=false
      - OPENBLAS_CORETYPE=GENERIC
      - MKL_DEBUG_CPU_TYPE=5
    ports:
      - "${AIEVO_PORT:-8100}:8100"
    volumes:
      # 卷形态可用 env 切换：默认 bind 到 compose 目录下；NAS 等经代理工具
      # 执行 compose 的场景可设 LOGS_VOLUME/UPLOADS_VOLUME 为命名卷
      - ${LOGS_VOLUME:-./logs}:/app/logs
      # 上传产物持久化（执行包解包区 / 人工补传区 / 脚本包 / 任务产物）：
      # 此前落在容器可写层，容器重建即丢；人工补传文件无法从 anc-hub 幂等
      # 重建，丢失后必须重新人工上传，故挂卷持久化（api 与 worker 共享
      # 同一卷；首次部署为空，历史包需重新导入，见部署文档）
      - ${UPLOADS_VOLUME:-./uploads}:/app/uploads
    # W13：日志轮转（json-file 50m×3，防止 docker 日志撑爆部署机磁盘）+
    # healthcheck（真实依赖探测：DB/Redis/迁移版本/uploads 全绿才 healthy）。
    # 探活 URL 在鉴权白名单内，无需 cookie；镜像内无 curl，用 python 探测。
    # 注意：迁移版本探针要求 alembic_version 与迁移 heads 一致——部署新代码
    # 后若引入了新迁移，需按 docs/build-pipeline.md 执行 alembic upgrade head。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health/deep', timeout=8); sys.exit(0 if r.status==200 else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - ai-evo-net

  worker:
    image: ai-evo:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.online
      args:
        - NODE_IMAGE=${NODE_IMAGE:-node:24-slim}
        - PY_IMAGE=${PY_IMAGE:-python:3.12-slim}
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ai-evo-worker
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=worker
      - LANGFUSE_ENABLED=false
      - OPENBLAS_CORETYPE=GENERIC
      - MKL_DEBUG_CPU_TYPE=5
    # 停止时给 Celery 优雅退出的时间：收到 SIGTERM 后跑完当前任务再退出，
    # 排队中的任务保留在 Redis 队列由新 worker 接手（部署脚本不再清空队列）。
    # W10-3：900s → 7200s，与 celery task_time_limit（单任务最长 2h）对齐——
    # 900s 窗口内跑不完的长任务会被 docker 强杀（SIGKILL），任务中断且消息
    # 未 ACK 会被重投。
    stop_grace_period: 7200s
    volumes:
      - ${LOGS_VOLUME:-./logs}:/app/logs
      # 与 api 共享同一卷（worker 的 Celery 任务也读写 uploads：执行包
      # 解包、评测镜像、脚本运行产物）
      - ${UPLOADS_VOLUME:-./uploads}:/app/uploads
    # W13：日志轮转 + healthcheck（celery inspect ping 定点问本 worker，
    # 无响应 = 进程僵死/丢注册；Redis 不可达时同样失败）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - ai-evo-net

  # anc-hub 插件 sidecar：把 ai-evo 核心能力暴露为 MCP 工具（见 docs/hub-plugin.md）。
  # 与 hub 家族其他插件一致走 host 网络——hub（同机）经回环拨插件 :9500，
  # 插件经回环调本机 api :8100，advertise 地址填 hub 视角可拨通的回环即可。
  # 注意：不挂 env_file（.env 里的 DATABASE_URL 等凭证与本服务无关，不进容器）；
  # ${AIEVO_HUB_*} 插值仍从部署目录 .env 读取（compose 项目级行为）。
  hub-plugin:
    image: ai-evo:${IMAGE_TAG:-latest}
    container_name: ai-evo-hub-plugin
    depends_on:
      - api
    environment:
      - SERVICE_TYPE=hub-plugin
      - HUB_ADDR=${AIEVO_HUB_ADDR:-http://127.0.0.1:8093}
      - HUB_ADVERTISE_ADDR=${AIEVO_HUB_ADVERTISE_ADDR:-http://127.0.0.1:9500}
      - HUB_LISTEN_ADDR=:9500
      - HUB_INSTANCE_ID=ai-evo-hub-plugin-1
      - AIEVO_API_BASE=${AIEVO_API_BASE:-http://127.0.0.1:8100}
    # W13：日志轮转 + healthcheck。hubkit 是 gRPC 服务（非 HTTP），没有可 GET 的
    # 健康路由，退而求其次做 TCP 端口探活：进程监听 :9500 即视为存活
    # （host 网络下 127.0.0.1:9500 即宿主回环）。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 9500), 3).close()\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    network_mode: host

volumes:
  pgdata:
  # 群晖等部署通过 .env 设 UPLOADS_VOLUME/LOGS_VOLUME 指向这两个命名卷
  uploads:
  logs:

networks:
  ai-evo-net:
    driver: bridge

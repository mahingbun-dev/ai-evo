[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aievo-cli"
version = "0.1.0"
description = "AI-Evo 评测平台命令行工具：触发评测、等待门禁判定并以 0/1/2 退出码供 CI 卡发布"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
aievo = "aievo_cli.cli:app"

[tool.setuptools.packages.find]
include = ["aievo_cli*"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 迁移类测试直接 inspect 真实库 schema，WebSocket 端点会启动 Redis PubSub
    # 监听——与部署形态一致，pytest 前先起 PG / Redis 并跑 alembic 迁移
    env:
      DATABASE_URL: postgresql://ai_evo:ai_evo@127.0.0.1:5432/ai_evo
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_JWT_SECRET: ci-fixed-test-secret-0123456789abcdef
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_evo
          POSTGRES_PASSWORD: ai_evo
          POSTGRES_DB: ai_evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # 与项目约定一致，依赖装进独立 venv
      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run database migrations
        run: .venv/bin/alembic upgrade head
        env:
          AIEVO_DATABASE_URL: postgresql://ai_evo:ai_evo@127.0.0.1:5432/ai_evo

      # ARCH-1-4/3-3 口径：SCRIPT_EXEC_MODE 缺省已是 container，契约冒烟与
      # debug 试跑链走 docker run（worker docker-CLI 回退通道）——runner 上
      # 必须先有 ai-evo-script-runner 镜像，否则安全门禁用例报「入口脚本
      # 退出码 125」（本地预载过镜像所以门禁时绿，CI 干净环境才暴露）
      - name: Build script-runner sandbox image
        run: docker build -f docker/script-runner/Dockerfile -t ai-evo-script-runner:latest .

      - name: Run test suite
        run: .venv/bin/pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 与 Dockerfile.online 的 corepack 钉版一致
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 验证 Dockerfile.online 在干净 clone 上可构建（claude-local/ 不入 git，
      # 通配 COPY 缺失时跳过，镜像不含 Claude Code CLI 但构建不失败）
      - name: Build image
        run: >-
          docker build -f Dockerfile.online
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          --build-arg NPM_REGISTRY=https://registry.npmjs.org
          -t ai-evo:ci .

      # ARCH-3-3（设计 §3 表 3-3 行）：构建一次、下游 image-scan job 复用
      # （docker save 打包上传 artifact，扫描 job load 回来跑 trivy——
      # GitHub runner 间不共享 docker daemon，重复构建主镜像太浪费）
      - name: Save image for scan
        run: docker save ai-evo:ci | gzip > /tmp/ai-evo-ci.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: main-image
          path: /tmp/ai-evo-ci.tar.gz
          retention-days: 1

  # ARCH-3-3（设计 §3 Phase 3 表 3-3 行）：镜像漏洞扫描门禁——主镜像与
  # script-runner 沙箱镜像（docker/script-runner/Dockerfile）各扫一遍，
  # HIGH 及以上（HIGH,CRITICAL）exit-code 1 卡门禁。企业 GitLab 线的等价
  # 扫描在 build-service 构建钩子里（tools/build-service/，[scan] 配置段），
  # 两端口径一致：同 severity 阈值 + ignore-unfixed（无修复版本的基座 CVE
  # 由基座升级解决，不永久卡门禁；有修复的高危 CVE 仍卡——演练口径即此类）。
  image-scan:
    name: Image vulnerability scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: main-image
          path: /tmp

      - name: Load main image
        run: docker load -i /tmp/ai-evo-ci.tar.gz

      # script-runner 镜像轻（python:3.12-slim + packages.txt 少量依赖），
      # 直接在本 job 内构建；沙箱是用户代码执行面，必须与主镜像同口径过闸
      - name: Build script-runner image
        run: docker build -f docker/script-runner/Dockerfile -t ai-evo-script-runner:ci .

      - name: Scan main image (ai-evo)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ai-evo:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan script-runner image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ai-evo-script-runner:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

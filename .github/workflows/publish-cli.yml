# aievo-cli 发布到 PyPI（P0-E：CI 模板默认通道的来源）
#
# 触发：打 `cli-v*` tag（如 cli-v0.1.0）手动 workflow_dispatch。
# 前置：仓库 Settings → Secrets → Actions 配置 PYPI_API_TOKEN
# （PyPI 账号 → API tokens，scope 选 aievo-cli 项目或整个账号）。
# 未配置 token 时 workflow 会失败在 trusted publishing 之后的 token 步骤——
# 这是预期行为，发布动作由仓库所有者显式执行。
name: publish-cli

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # PyPI 官方 action 的 trusted publishing（优先）与 id-token 要求
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build cli/

      - name: 校验元数据
        run: python -m twine check cli/dist/*

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist/
          # 有 PYPI_API_TOKEN secret 时启用密码发布；否则走 trusted publishing
          # （需在 PyPI 项目设置里预先配置 GitHub publisher）
          password: ${{ secrets.PYPI_API_TOKEN }}
